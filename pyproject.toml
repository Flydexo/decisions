[project]
name = "decisions"
version = "0.1.0"
description = "MPS training of frozen-encoder typed decisions over streaming datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "hydra-core>=1.3.2,<1.4",
    "jupyter>=1.1.1",
    "requests>=2.32,<3",
    "torch>=2.14.0",
    "trackio>=0.40.0,<1",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
benchmark = [
    "decision-index",
]

[tool.uv.sources]
decision-index = { url = "https://github.com/apolinario/decision-index/archive/87d4650b42b377c0291a89c1f1a879f9b31082bf.tar.gz" }
