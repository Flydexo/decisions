[project]
name = "decisions"
version = "0.1.0"
description = "Streaming typed-decision training and ModernBERT fine-tuning on MPS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "hydra-core>=1.3.2,<1.4",
    "jupyter>=1.1.1",
    "requests>=2.32,<3",
    "torch>=2.14.0",
    "trackio>=0.40.0,<1",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
benchmark = [
    "decision-index[rebuild]",
]

[tool.uv.sources]
decision-index = { url = "https://github.com/apolinario/decision-index/archive/9eb2dbe2a358004c8782c66e40a83ac07b953fec.tar.gz" }
